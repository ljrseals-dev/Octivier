name: Pitch and protocol validation

on:
  pull_request:
    branches: [main]
  push:
    branches: ["repair/**"]

jobs:
  protocol-and-pitch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure JUCE-independent targets
        run: cmake -S . -B build -DOCTIVIER_PROTOCOL_TESTS_ONLY=ON

      - name: Build tests and benchmark
        run: cmake --build build --parallel 2

      - name: Run regression tests
        run: ctest --test-dir build --output-on-failure

      - name: Run bounded pitch benchmark smoke matrix
        run: ./build/PitchValidation --quick > pitch-validation-quick.csv

      - name: Upload quick benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: pitch-validation-quick
          path: pitch-validation-quick.csv
          if-no-files-found: error

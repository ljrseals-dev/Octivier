name: Protocol Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  slot-ownership:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure protocol-only tests
        run: cmake -S . -B build-protocol -DOCTIVIER_PROTOCOL_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build protocol test
        run: cmake --build build-protocol --config Release --parallel 2
      - name: Run protocol test
        run: ctest --test-dir build-protocol -C Release --output-on-failure
